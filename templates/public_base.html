<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Hospital Management System{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="public-body">
  <header class="public-topbar">
    <a class="public-brand" href="{{ url_for('auth.portal') }}">
      <span class="mark">HMS &middot; v2</span>
      <span class="name">Hospital Management System</span>
    </a>
    <nav class="public-nav">
      <a href="{{ url_for('auth.about') }}">About</a>
      <a href="{{ url_for('auth.portal') }}">Log in</a>
    </nav>
  </header>

  <main class="public-main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="public-flash-wrap">
        {% for category, message in messages %}
          <div class="flash flash-{{ 'error' if category == 'error' else 'success' }}">{{ message }}</div>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>

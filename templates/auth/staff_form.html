{% extends "base.html" %}
{% block title %}Add Staff — HMS{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h2>Add staff account</h2>
    <p class="subtitle">Creates a login for a doctor, pharmacy staff member, or another admin.</p>
  </div>
</div>

<div class="panel form-panel">
  <form method="post" id="staff-form">
    <div class="field">
      <label for="role">Role</label>
      <select id="role" name="role" required onchange="toggleDoctorFields()">
        <option value="">Select role...</option>
        <option value="doctor" {{ 'selected' if form.get('role') == 'doctor' }}>Doctor</option>
        <option value="pharmacy" {{ 'selected' if form.get('role') == 'pharmacy' }}>Pharmacy Staff</option>
        <option value="admin" {{ 'selected' if form.get('role') == 'admin' }}>Admin</option>
      </select>
    </div>
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" required>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="email">Email (login ID)</label>
        <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required>
      </div>
      <div class="field">
        <label for="password">Temporary password</label>
        <input type="password" id="password" name="password" required>
      </div>
    </div>
    <div class="field">
      <label for="phone">Phone number</label>
      <input type="text" id="phone" name="phone" value="{{ form.get('phone', '') }}">
    </div>

    <div id="doctor-fields" style="display:none;">
      <hr class="section-divider">
      <div class="field">
        <label for="specialization">Specialization</label>
        <input type="text" id="specialization" name="specialization" value="{{ form.get('specialization', '') }}" placeholder="e.g. Cardiology">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="available_days">Available days</label>
          <input type="text" id="available_days" name="available_days" value="{{ form.get('available_days', '') }}" placeholder="e.g. Mon, Wed, Fri">
        </div>
        <div class="field">
          <label for="available_time">Available time</label>
          <input type="text" id="available_time" name="available_time" value="{{ form.get('available_time', '') }}" placeholder="e.g. 10:00 - 14:00">
        </div>
      </div>
      <div class="field">
        <label for="consultation_fee">Consultation fee (Rs.)</label>
        <input type="number" id="consultation_fee" name="consultation_fee" min="0" step="1" value="{{ form.get('consultation_fee', '500') }}">
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Create account</button>
      <a class="btn" href="{{ url_for('auth.staff_list') }}">Cancel</a>
    </div>
  </form>
</div>

<script>
  function toggleDoctorFields() {
    const role = document.getElementById('role').value;
    document.getElementById('doctor-fields').style.display = (role === 'doctor') ? 'block' : 'none';
  }
  toggleDoctorFields();
</script>
{% endblock %}
